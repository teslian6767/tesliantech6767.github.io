<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telephone UI Prototype</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="route-list" id="routeList"></aside>
      <main class="phone">
        <header class="phone-header">
          <div>
            <p class="eyebrow">Figma-aligned prototype</p>
            <h1 id="screenTitle">Telephone</h1>
          </div>
          <button class="ghost-btn" id="copyRouteBtn">Copy route</button>
        </header>

        <section id="screenContent" class="screen-content"></section>

        <nav class="bottom-nav" id="bottomNav"></nav>
      </main>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
